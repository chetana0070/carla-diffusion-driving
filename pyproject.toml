[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carla-diffusion-driving"
version = "2.3.0"
description = "Temporal diffusion driving policy research pipeline for CARLA"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]
training = [
  "numpy>=1.26,<3",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "tqdm>=4.67,<5",
]
simulator = [
  "carla==0.9.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = [
  "carla_diffusion.bc_dataset",
  "carla_diffusion.bc_model",
  "carla_diffusion.temporal_bc_dataset",
  "carla_diffusion.temporal_bc_model",
  "carla_diffusion.temporal_runtime",
  "carla_diffusion.diffusion_dataset",
  "carla_diffusion.diffusion_policy",
  "carla_diffusion.diffusion_evaluation",
  "carla_diffusion.factorized_policy",
  "carla_diffusion.factorized_evaluation",
  "carla_diffusion.vla_dataset",
  "carla_diffusion.vla_policy",
  "carla_diffusion.vla_evaluation",
]
disable_error_code = ["import-not-found", "import-untyped", "misc"]
